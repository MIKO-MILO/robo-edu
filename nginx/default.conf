server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Tangkap semua request HTTPS yang masuk lewat ngrok atau reverse proxy luar
server {
    listen 443 ssl;
    server_name _;

    # Self-signed cert — hanya untuk menangkap koneksi SSL dari ngrok
    # (ngrok terminate SSL duluan, jadi cert ini tidak pernah dilihat browser)
    ssl_certificate     /etc/nginx/conf.d/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/conf.d/ssl/selfsigned.key;

    client_max_body_size 100M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
